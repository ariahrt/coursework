# managed-by: cnv deploy
# Shared settings for the /proxy/ and /upload/ locations in cnv.byhrt.com.
# Expects $canvas_host and $canvas_path to be set by the including location.

access_log off;
limit_req zone=cnv_canvas burst=60 nodelay;

resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

proxy_pass https://$canvas_host/$canvas_path$is_args$args;
proxy_ssl_server_name on;
proxy_ssl_name $canvas_host;
proxy_set_header Host $canvas_host;
proxy_set_header Cookie "";
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_hide_header Set-Cookie;
# Canvas links that point back at itself come back through the proxy.
proxy_redirect ~^https://([a-z0-9-]+\.instructure\.com)/(.*)$ /proxy/$1/$2;
