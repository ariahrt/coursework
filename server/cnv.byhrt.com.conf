# managed-by: cnv deploy
# Coursework (cnv.byhrt.com): static site + read-only pass-through to Canvas.
# Written in full by remote-setup.sh on every deploy; certbot doesn't edit it.
# The exact server_name here wins over the *.byhrt.com wildcard in dash.byhrt.com.

limit_req_zone $binary_remote_addr zone=cnv_canvas:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name cnv.byhrt.com;

    # A location (not a server-level return) so certbot's renewal challenge still gets through.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cnv.byhrt.com;

    ssl_certificate /etc/letsencrypt/live/cnv.byhrt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cnv.byhrt.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cnv.byhrt.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # /proxy/<school>.instructure.com/api/v1/... -> https://<school>.instructure.com/api/v1/...
    # Only Canvas hosts and only the API. The token rides along in the Authorization
    # header and is never logged or stored. Regex locations match top to bottom.

    # Writes: only turning in an assignment, starting a file upload, replying to a discussion,
    # and sending or replying to an Inbox message. (GET is allowed too: listing messages
    # uses the same address as sending one.)
    location ~ ^/proxy/([a-z0-9-]+\.instructure\.com)/(api/v1/(?:courses/[0-9~]+/(?:assignments/[0-9~]+/submissions(?:/self/files)?|discussion_topics/[0-9~]+/entries)|conversations(?:/[0-9~]+/add_message)?))$ {
        set $canvas_host $1;
        set $canvas_path $2;
        limit_except GET POST { deny all; }
        client_max_body_size 5m;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/cnv-canvas-proxy.conf;
    }

    # Reads: anything under the API.
    location ~ ^/proxy/([a-z0-9-]+\.instructure\.com)/(api/v1/.*)$ {
        set $canvas_host $1;
        set $canvas_path $2;
        limit_except GET { deny all; }
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/cnv-canvas-proxy.conf;
    }

    # File uploads go to whatever storage host Canvas names (its own, Inst-FS, or its S3 bucket).
    # No token is sent there. Must match UPLOAD_HOST in app.js.
    location ~ ^/upload/((?:[a-z0-9-]+\.)*(?:instructure\.com|inscloudgate\.net)|instructure-uploads[a-z0-9-]*\.s3[a-z0-9.-]*\.amazonaws\.com)/(.*)$ {
        set $canvas_host $1;
        set $canvas_path $2;
        limit_except POST { deny all; }
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/cnv-canvas-proxy.conf;
        proxy_set_header Authorization "";
        # Some storage hosts confirm with a redirect to Canvas; hand that address to the page
        # instead of letting the browser follow it without the token.
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @cnv_upload_redirect;
    }

    # File downloads for in-app previews: only Canvas file-download links,
    # only reads, no token (the link's own verifier grants access). Canvas answers with a
    # redirect to its file storage; nginx follows it here so the browser gets the bytes.
    location ~ ^/filedl/([a-z0-9-]+\.instructure\.com)/((?:courses/[0-9~]+/)?files/[0-9~]+/download)$ {
        set $canvas_host $1;
        set $canvas_path $2;
        limit_except GET { deny all; }
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/cnv-canvas-proxy.conf;
        proxy_set_header Authorization "";
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 301 302 303 307 308 = @cnv_follow;
    }

    location @cnv_follow {
        access_log off;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $cnv_next $upstream_http_location;
        proxy_pass $cnv_next;
        proxy_ssl_server_name on;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @cnv_follow;
    }

    location /filedl/ {
        return 403;
    }

    location @cnv_upload_redirect {
        add_header X-Cnv-Location $upstream_http_location always;
        return 204;
    }

    location /proxy/ {
        return 403;
    }

    location /upload/ {
        return 403;
    }
}
