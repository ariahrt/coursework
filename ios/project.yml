# XcodeGen spec for the iPhone app. The GitHub Actions workflow turns this into an
# Xcode project and builds it on a Mac, since iOS apps can't be built on Windows.
name: Coursework
options:
  bundleIdPrefix: com.byhrt
  deploymentTarget:
    iOS: "16.0"
targets:
  Coursework:
    type: application
    platform: iOS
    sources: [Coursework]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byhrt.coursework
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Coursework
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Needed when you pick "Take Photo" or a photo while attaching a file to a submission.
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to attach to an assignment."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos to assignments."
